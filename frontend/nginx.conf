server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Raised from nginx's 1 MB default — wiki attachment uploads (see the
    # backend's own maxAttachmentSize) need headroom above that, and
    # multipart form overhead adds a little on top of the raw file size.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # NOT $remote_addr — this container isn't the true edge, the
        # outer nginx (see nginx/templates/default.conf.template) already
        # set X-Real-IP correctly from the real client's address one hop
        # back. Setting it again here would overwrite that with this hop's
        # own peer address (the edge nginx container), collapsing every
        # real client behind a single apparent IP — which would have made
        # the backend's login rate limiter (keyed by X-Real-IP) share one
        # bucket across every admin and employee, letting one lockout take
        # everyone else down with it. Omitting the directive here lets the
        # header nginx already forwards through untouched.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Module install/enable can pull large images on first run and take
        # minutes — matches the backend's own 10-minute operation timeout,
        # so this proxy doesn't cut the connection before the real result.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
