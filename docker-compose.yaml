networks:
  default: {}
  # Modules attach their web-facing service to this network (as an external
  # network, see modules/hello-world/docker-compose.yaml) so the edge nginx
  # can reach them by container name. Fixed subnet so nginx can be given a
  # static IP below — the internal gateway (see internal-gateway/) advertises
  # that one address as a NetBird route, and a route needs a stable target.
  edge:
    name: it-platform-edge
    ipam:
      config:
        - subnet: 10.201.28.0/24
          # Dynamic allocation (every module container, since none of them
          # pin an address) is restricted to this sub-range so it can never
          # land on .2/.3/.4 — those are reserved below for nginx/backend/
          # internal-gateway and MUST stay fixed across restarts.
          ip_range: 10.201.28.16/28

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: itplatform-nginx
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
    ports:
      - "8000:80"
      # The platform itself is still plain-HTTP-only (see README) — this is
      # only for video-jitsi's self-signed TLS vhost (Manifest.NeedsTLS),
      # the one module so far that genuinely can't work without a real
      # HTTPS/WSS listener. Standard 443, matching video-jitsi's own
      # PUBLIC_URL, which assumes the default port rather than carrying an
      # explicit one — unlike port 8000 above, nothing else on this
      # platform claims 443, so there's no dev-convenience reason to
      # offset it the way 8000 offsets 80.
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      edge:
        # Fixed, not Docker's next-available assignment — the internal
        # gateway advertises this exact address as a NetBird route, so it
        # has to stay put across restarts/recreates.
        ipv4_address: 10.201.28.2
      default: {}
    depends_on:
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itplatform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default: {}
      # Reachable by module containers too — only feature-modules that
      # declare needs_database: true in their manifest (see modules/wiki)
      # actually get the password needed to connect, but the network
      # itself has to reach this far for that to be possible at all.
      edge: {}

  backend:
    build: ./backend
    restart: unless-stopped
    networks:
      default: {}
      edge:
        # Pinned so it can never race nginx (.2) or internal-gateway (.4)
        # for their addresses — Docker hands out .2 to whichever
        # unreserved container starts first, and that's happened to be
        # each of the other two on different deploys.
        ipv4_address: 10.201.28.3
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://itplatform:${POSTGRES_PASSWORD}@postgres:5432/itplatform?sslmode=disable
      MODULES_DIR: /app/modules
      DATA_DIR: /app/data/modules
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BASE_DOMAIN: ${BASE_DOMAIN}
      NGINX_CONF_DIR: /app/nginx/conf.d
      NGINX_CONTAINER_NAME: itplatform-nginx
      GATEWAY_CONTAINER_NAME: itplatform-internal-gateway
      MODULE_REGISTRY_URL: ${MODULE_REGISTRY_URL:-}
      MODULE_REGISTRY_KEY: ${MODULE_REGISTRY_KEY:-}
    volumes:
      # Writable, not :ro — the module registry (see registry/) downloads
      # brand-new and updated modules' manifest.yaml/docker-compose.yaml
      # straight into this directory at runtime; see
      # backend/internal/modules/updates.go.
      - ./modules:/app/modules
      - ./data/modules:/app/data/modules
      - ./nginx/conf.d:/app/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  # The one always-on NetBird client that makes "private" modules reachable
  # over the VPN at all. It enrolls itself (see backend's
  # bootstrapInternalGateway) and then tells NetBird "route traffic for
  # nginx's address (10.201.28.2) through me" — nothing else about it is
  # module-specific; every private module just gets its own port on that
  # one advertised address. Not a "module" in the platform's own sense
  # (nothing to install/uninstall from the panel) — it's core
  # infrastructure, alongside nginx and postgres.
  internal-gateway:
    image: netbirdio/netbird:latest
    container_name: itplatform-internal-gateway
    hostname: itplatform-internal-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    entrypoint: /bin/bash
    command: ["-c", "netbird service run & wait"]
    # Same fix as modules/vpn-netbird/docker-compose.yaml's own extra_hosts:
    # this container reaches the VPN server at its public hostname:port
    # (same as any real client would, not an internal container address —
    # the server tells every peer, including this one, to use its public
    # exposedAddress for Signal regardless of how Management was reached),
    # and when BASE_DOMAIN is "localhost" that hostname is otherwise magic
    # loopback (RFC 6761) and resolves to this container's own empty
    # loopback instead of the host's published port.
    extra_hosts:
      - "vpn-netbird.${BASE_DOMAIN}:host-gateway"
    volumes:
      - internal_gateway_data:/var/lib/netbird
    networks:
      edge:
        # Fixed too, same reason as nginx's — and specifically NOT .2:
        # Docker's IPAM hands out .2 to whichever container starts first
        # if it isn't reserved, and it raced nginx for it here.
        ipv4_address: 10.201.28.4

volumes:
  postgres_data:
  internal_gateway_data:
