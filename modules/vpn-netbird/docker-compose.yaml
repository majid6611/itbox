networks:
  default: {}
  edge:
    external: true
    name: it-platform-edge

services:
  # netbird-server has no shell of its own, so a tiny busybox init step
  # writes its config into a shared named volume before the real container
  # starts — same pattern used for Garage and WebDAV elsewhere in this
  # platform.
  netbird-config:
    image: busybox:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /config/config.yaml <<EOF
        server:
          listenAddress: ":80"
          # Published straight to the host on its own port (8090), bypassing
          # the edge nginx entirely — nginx can't multiplex this: the actual
          # client protocol here is native gRPC (Management/Signal), and
          # plaintext HTTP/2 (h2c) protocol detection is a per-listen-socket
          # thing in nginx, not per-vhost, so it can't share port 8000 with
          # every other module's plain HTTP/1.1 vhost. A dedicated port with
          # a raw TCP passthrough sidesteps that — same reason STUN below
          # gets its own published port instead of going through nginx too.
          exposedAddress: "http://${MODULE_ID}.${BASE_DOMAIN}:8090"
          dataDir: "/var/lib/netbird/"
          store:
            engine: "sqlite"
            encryptionKey: "${store_encryption_key}"
          stunPorts: [3478]
          authSecret: "${relay_auth_secret}"
          auth:
            issuer: "http://${MODULE_ID}.${BASE_DOMAIN}:8090/oauth2"
            localAuthDisabled: false
            dashboardRedirectURIs:
              - "http://${MODULE_ID}.${BASE_DOMAIN}:8090/nb-auth"
              - "http://${MODULE_ID}.${BASE_DOMAIN}:8090/nb-silent-auth"
            cliRedirectURIs:
              - "http://localhost:53000/"
            sessionCookieEncryptionKey: "${session_cookie_key}"
        EOF
    volumes:
      - netbird_config:/config

  netbird-server:
    image: netbirdio/netbird-server@sha256:e71f39cefcd90956d818dc4179084fd47d39f0741d1211b818ec640766b5794d
    restart: unless-stopped
    command: ["--config", "/etc/netbird/config.yaml"]
    environment:
      NB_SETUP_PAT_ENABLED: "true"
    volumes:
      - netbird_config:/etc/netbird
      - netbird_data:/var/lib/netbird
    ports:
      - "3478:3478/udp"
      - "8090:80"
    # ${MODULE_ID}.${BASE_DOMAIN} only resolves to the host's own
    # port-forward from the *host* itself. From inside this container it'd
    # resolve to nothing, but netbird-server needs to reach its own issuer
    # (the 8090 passthrough above) at that exact hostname — for OIDC
    # discovery + token validation to line up with what the client uses.
    # Routing it at the host's own gateway IP reaches the same host
    # port-forward our own requests use.
    extra_hosts:
      - "${MODULE_ID}.${BASE_DOMAIN}:host-gateway"
    depends_on:
      netbird-config:
        condition: service_completed_successfully
    networks:
      - default
      - edge

volumes:
  netbird_config:
  netbird_data:
