id: vpn-netbird
name: VPN (Netbird)
description: >-
  Self-hosted WireGuard mesh VPN. Give a company user access with one
  click and hand them a setup file — no passwords or logins to configure,
  just paste a code into the VPN app once. Works on its own, but the
  Identity (OpenLDAP) module is what gives you a list of company users to
  grant access to. Managed from this platform's own panel — Netbird's own
  dashboard is never installed.
category: networking
version: "1.0.0"
compose_file: docker-compose.yaml
config_schema:
  - key: owner_email
    label: Internal bootstrap admin email
    type: string
    default: "admin@internal.local"
    hidden: true
  - key: owner_password
    label: Internal bootstrap admin password
    type: secret
    default: ""
    hidden: true
  - key: store_encryption_key
    label: Internal datastore encryption key
    type: secret_base64
    default: ""
    hidden: true
  - key: session_cookie_key
    label: Internal session cookie key
    type: secret_base64
    default: ""
    hidden: true
  - key: relay_auth_secret
    label: Internal relay auth secret
    type: secret
    default: ""
    hidden: true
soft_dependencies:
  - id: ldap-openldap
    integration: directory
internal_panel: /vpn
# netbird-server itself is NOT routed through the edge nginx at all — its
# client protocol (gRPC for Management/Signal) can't share nginx's shared
# port 80 with every other module's plain HTTP/1.1 vhost (see
# docker-compose.yaml's comment on the 8090 port publish), so it gets a
# direct host port instead. Nothing else in this module needs a route.
