# Cap each container's log (Docker keeps them forever otherwise, and a chatty
# container can fill a small disk): 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  default: {}
  edge:
    external: true
    name: it-platform-edge

services:
  # hacdias/webdav has no shell of its own, so (as with the Garage
  # module) a tiny busybox init step writes the config into a shared
  # named volume before the real container starts. Only when there isn't
  # one yet: logins for other users are added to this file later (see the
  # backend's syncWebdavLogin), and rewriting it on every container
  # recreate wiped them back to just the admin.
  webdav-config:
    logging: *logging
    image: busybox:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /config/config.yml ] && exit 0
        cat > /config/config.yml <<EOF
        address: 0.0.0.0
        port: 6065
        tls: false
        prefix: /
        behindProxy: true
        directory: /data
        permissions: R

        users:
          - username: ${admin_username}
            password: ${admin_password}
            permissions: CRUD
        EOF
    volumes:
      - webdav_config:/config

  webdav:
    logging: *logging
    image: ghcr.io/hacdias/webdav:latest
    restart: unless-stopped
    command: ["-c", "/config/config.yml"]
    volumes:
      - webdav_config:/config
      - webdav_data:/data
    depends_on:
      webdav-config:
        condition: service_completed_successfully
    networks:
      - default
      - edge

volumes:
  webdav_config:
  webdav_data:
