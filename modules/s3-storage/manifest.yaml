id: s3-storage
name: S3 Storage (Garage)
description: >-
  Self-hosted S3-compatible object storage with a web admin console, for
  backups, app storage, and any tool that expects an S3 API. Uses Garage
  (Deuxfleurs) — MinIO's community edition was discontinued in 2026.
category: storage
version: "1.0.0"
compose_file: docker-compose.yaml
config_schema:
  - key: default_bucket
    label: Default bucket name
    type: string
    default: "company-files"
  - key: access_key
    label: S3 access key
    type: secret
    default: ""
  - key: secret_key
    label: S3 secret key
    type: secret
    default: ""
  - key: rpc_secret
    label: Internal RPC secret
    type: secret
    default: ""
    hidden: true
  - key: admin_token
    label: Internal admin API token
    type: secret
    default: ""
    hidden: true
soft_dependencies: []
routes:
  - service: garage-webui
    port: 3909
  - name: api
    service: garage
    port: 3900
