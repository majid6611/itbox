id: s3-storage
name: Backup Storage (Garage)
description: >-
  Self-hosted S3-compatible object storage, used as the local backup
  destination for WebDAV. Headless — there's no dashboard to open, and
  nothing is exposed publicly. Managed entirely from the Backup panel.
  Uses Garage (Deuxfleurs); MinIO's community edition was discontinued
  in 2026 (repo archived), so this platform doesn't use it.
category: storage
version: "1.0.0"
compose_file: docker-compose.yaml
config_schema:
  - key: default_bucket
    label: Backup bucket name
    type: string
    default: "webdav-backup"
    hidden: true
  - key: access_key
    label: Internal S3 access key
    type: secret
    default: ""
    hidden: true
  - key: secret_key
    label: Internal S3 secret key
    type: secret
    default: ""
    hidden: true
  - key: rpc_secret
    label: Internal RPC secret
    type: secret
    default: ""
    hidden: true
  - key: admin_token
    label: Internal admin API token
    type: secret
    default: ""
    hidden: true
soft_dependencies: []
internal_panel: /backup
