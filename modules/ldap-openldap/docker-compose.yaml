# Cap each container's log (Docker keeps them forever otherwise, and a chatty
# container can fill a small disk): 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  default: {}
  edge:
    external: true
    name: it-platform-edge

services:
  openldap:
    logging: *logging
    image: vegardit/openldap:2.6.10
    restart: unless-stopped
    environment:
      LDAP_INIT_ORG_DN: ${base_dn}
      LDAP_INIT_ORG_NAME: ${org_name}
      LDAP_INIT_ROOT_USER_PW: ${admin_password}
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    networks:
      - default
      - edge

volumes:
  openldap_data:
  openldap_config:
