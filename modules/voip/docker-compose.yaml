# Cap each container's log (Docker keeps them forever otherwise, and a chatty
# container can fill a small disk): 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Two containers: Asterisk itself (the engine, never seen by anyone) and
# our own voip service, which owns the extensions/settings in the
# platform's Postgres, writes Asterisk's config into a shared volume from
# them, and tells Asterisk to reload over its manager port (AMI).
networks:
  edge:
    external: true
    name: it-platform-edge

volumes:
  asterisk_itp:
  asterisk_cdr:
  asterisk_spool:
  # The phone-menu greeting: written by the voip service (upload) or by
  # Asterisk itself (recorded by phone), played back by Asterisk.
  asterisk_sounds:

services:
  voip:
    logging: *logging
    # Built from the source shipped with the module (MODULE_DIR/MODULE_VERSION
    # are filled in by the platform). The version in the tag is what keeps the
    # previous version's image around for a rollback — so bump the module's
    # version in manifest.yaml whenever its code changes.
    build: ${MODULE_DIR}/service
    image: it-voip:${MODULE_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AMI_SECRET: ${ami_secret}
    volumes:
      - asterisk_itp:/asterisk/itp
      - asterisk_cdr:/asterisk/cdr:ro
      - asterisk_sounds:/sounds
    networks:
      - edge

  asterisk:
    logging: *logging
    build: ${MODULE_DIR}/asterisk
    image: it-asterisk:${MODULE_VERSION}
    restart: unless-stopped
    # Host networking, not published ports: SIP puts IP addresses inside
    # its own messages, and behind Docker's NAT Asterisk would hand phones
    # its container-internal address for audio — the classic "call
    # connects, nobody hears anything" failure. On the host's own network
    # it sees and advertises the server's real LAN address with no extra
    # configuration. It also avoids publishing 1000 RTP ports one by one.
    network_mode: host
    environment:
      AMI_SECRET: ${ami_secret}
    volumes:
      - asterisk_itp:/etc/asterisk/itp:ro
      - asterisk_cdr:/var/log/asterisk/cdr-csv
      - asterisk_sounds:/var/lib/itp-sounds
      - asterisk_spool:/var/spool/asterisk
