; Where office phones may connect from: private networks and the VPN
; (100.64.0.0/10 is NetBird's range). Used by every extension (see the
; generated pjsip.conf); the outside-line provider is not held to it.
[itp-lan]
deny = 0.0.0.0/0.0.0.0
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
permit = 100.64.0.0/255.192.0.0
