; Ringback/busy tones Asterisk itself generates (e.g. while ringing the
; main number for an outside caller). Without a default country there are
; none at all and the caller hears silence.
[general]
country = us

[us]
description = United States
ringcadence = 2000,4000
dial = 350+440
busy = 480+620/500,0/500
ring = 440+480/2000,0/4000
congestion = 480+620/250,0/250
callwaiting = 440/300,0/10000
record = 1400/500,0/15000
info = !950/330,!1400/330,!1800/330,0
