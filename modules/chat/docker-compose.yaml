# Cap each container's log (Docker keeps them forever otherwise, and a chatty
# container can fill a small disk): 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
    external: true
    name: it-platform-edge

services:
  chat:
    logging: *logging
    # Built from the source shipped with the module (MODULE_DIR/MODULE_VERSION
    # are filled in by the platform). The version in the tag is what keeps the
    # previous version's image around for a rollback — so bump the module's
    # version in manifest.yaml whenever its code changes.
    build: ${MODULE_DIR}/service
    image: it-chat:${MODULE_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - edge
