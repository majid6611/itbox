# Dev overrides: hot-reload both backend and frontend by running their
# toolchains directly against the source tree instead of the built images.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#
# Dev mode bypasses the edge nginx for the frontend/backend (talk to Vite
# directly at :5173) to avoid routing Vite's HMR websocket through it.
# The edge nginx still runs and will route to any installed module normally.
services:
  backend:
    build: null
    image: golang:1.25-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache docker-cli docker-cli-compose && go run ./cmd/server"
    volumes:
      - ./backend:/app
      - ./modules:/app/modules:ro
      - ./data/modules:/app/data/modules
      - /var/run/docker.sock:/var/run/docker.sock
      - go_mod_cache:/go/pkg/mod
    environment:
      LISTEN_ADDR: ":8080"

  frontend:
    build: null
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080

volumes:
  go_mod_cache:
  frontend_node_modules:
