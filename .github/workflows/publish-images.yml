name: Publish Docker images

# Builds straight from a tagged commit, never a local working copy — the
# only way to guarantee a published image traces back to real, reviewed
# source. Triggered by pushing a version tag (e.g. `git tag v1.0.1 && git
# push origin v1.0.1`), not on every commit to main — a tag is a
# deliberate "this is a release" decision, matching module versions'
# own manual-bump convention (see backend/internal/version).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Read version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are repo secrets (Settings ->
      # Secrets and variables -> Actions) — a Docker Hub access token, not
      # your account password (Docker Hub: Account Settings -> Security ->
      # New Access Token, Read & Write scope).
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            majid6611/itbox-backend:${{ steps.version.outputs.version }}
            majid6611/itbox-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            majid6611/itbox-frontend:${{ steps.version.outputs.version }}
            majid6611/itbox-frontend:latest
